# адреса - имена сервисов и их внутренние порты в сети docker compose
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: [ 'user-service:3000' ]

  - job_name: notification-service
    static_configs:
      - targets: [ 'notification-service:3001' ]